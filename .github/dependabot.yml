version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      go-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      ci-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
